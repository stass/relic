# Slower and rarer configurations, run weekly and on demand: MemorySanitizer,
# ThreadSanitizer, the random program driver over many seeds, the fuzz
# targets, 32-bit pointers, no threads, and distcheck without shared or
# without static libraries.  As in ci.yml, RELIC_STRICT_CHECK=yes makes a
# skipped test or an unavailable sanitizer fail the job.

name: extended

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELIC_STRICT_CHECK: 'yes'
  LINUX_PACKAGES: >-
    autoconf automake libtool pkg-config libedit-dev mandoc g++ clang

jobs:
  sanitizers:
    name: linux clang ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [check-msan, check-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      # The runner's kernel randomizes more address bits than the
      # sanitizers' shadow memory layout allows for; they abort at start-up
      # under the default.
      - name: Narrow address randomization for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          ./autogen.sh
          ./configure CC=clang CXX=clang++
      - name: Run the suite under the sanitizer
        run: make -j"$(nproc)" ${{ matrix.target }}

  # The random program driver over a range of seeds far past the fifty make
  # check runs, built with AddressSanitizer and UndefinedBehaviorSanitizer so
  # that a program which crashes or misbehaves under one strategy is found as
  # well as one on which two strategies disagree; make check-random sets the
  # sanitizer options the sanitizer targets use.  Each new run of the
  # workflow takes the next range of seeds, so the weeks together cover new
  # programs, while a rerun of a run repeats its range; the range is printed,
  # and `make check-random RELIC_SEED_START=S RELIC_SEEDS=N` reproduces it.
  random:
    name: linux clang random programs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELIC_SEEDS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Narrow address randomization for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          ./autogen.sh
          ./configure CC=clang CXX=clang++ --enable-asan --enable-ubsan
      - name: Build
        run: make -j"$(nproc)" tests/random/random
      - name: Run the random program driver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          start=$((RUN_NUMBER * RELIC_SEEDS + 1))
          echo "seeds $start to $((start + RELIC_SEEDS - 1))"
          make check-random RELIC_SEEDS="$RELIC_SEEDS" \
              RELIC_SEED_START="$start"

  # The four libFuzzer targets, each for FUZZ_SECONDS, under AddressSanitizer
  # and UndefinedBehaviorSanitizer with the options make fuzz sets.  configure fails rather than build a tree
  # with nothing to fuzz when the compiler lacks libFuzzer.  An input that
  # fails a target is kept as an artifact, to be read and, once understood,
  # copied into the corpus as a regression.
  fuzz:
    name: linux clang fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FUZZ_SECONDS: '900'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Narrow address randomization for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          ./autogen.sh
          ./configure CC=clang CXX=clang++ --enable-fuzzers \
              --enable-asan --enable-ubsan
      - name: Build
        run: make -j"$(nproc)"
      - name: Fuzz
        run: make fuzz FUZZ_SECONDS="$FUZZ_SECONDS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  linux-variants:
    name: linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # There is no 32-bit libedit on the runner, so line editing is
          # left out of this build, and its checks are skipped.
          - name: gcc -m32
            packages: gcc-multilib g++-multilib
            cc: gcc -m32
            cxx: g++ -m32
            flags: --enable-werror --with-libedit=no
            allowed_skips: editing.sh
          - name: gcc without threads
            packages: ''
            cc: gcc
            cxx: g++
            flags: --enable-werror --disable-threads
            allowed_skips: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ${{ env.LINUX_PACKAGES }} ${{ matrix.packages }}
      # The compilers are passed through the environment so that a compiler
      # with an option, such as gcc -m32, reaches configure as one argument.
      - name: Configure
        env:
          CONFIGURE_CC: ${{ matrix.cc }}
          CONFIGURE_CXX: ${{ matrix.cxx }}
        run: |
          ./autogen.sh
          ./configure ${{ matrix.flags }} \
              CC="$CONFIGURE_CC" CXX="$CONFIGURE_CXX"
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        env:
          RELIC_ALLOWED_SKIPS: ${{ matrix.allowed_skips }}
        run: make -j"$(nproc)" check || { cat test-suite.log; exit 1; }

  distcheck:
    name: distcheck ${{ matrix.flags }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # With no shared library there is no export table to audit.
          - flags: --disable-shared
            allowed_skips: symbols.sh
          - flags: --disable-static
            allowed_skips: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Configure
        run: |
          ./autogen.sh
          ./configure
      - name: Build, install and test the release tarball out of tree
        env:
          RELIC_ALLOWED_SKIPS: ${{ matrix.allowed_skips }}
        run: |
          make -j"$(nproc)" distcheck \
              DISTCHECK_CONFIGURE_FLAGS=${{ matrix.flags }}
