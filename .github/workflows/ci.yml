# Checks run on every push to master and every pull request: the two Linux
# compilers with warnings as errors, AddressSanitizer with leak detection and
# UndefinedBehaviorSanitizer, make distcheck, and the release tarball built
# on glibc and musl with no autotools installed.
#
# Every job sets RELIC_STRICT_CHECK=yes, so a test that skips for want of a
# tool, or a sanitizer suite the compiler cannot build, fails the job rather
# than passing while checking nothing.
#
# Slower and rarer configurations are in extended.yml, and macOS in
# macos.yml.  Actions are pinned to a commit; the tag each one was taken from
# is in the comment beside it.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RELIC_STRICT_CHECK: 'yes'
  LINUX_PACKAGES: >-
    autoconf automake libtool pkg-config libedit-dev mandoc g++ clang

jobs:
  linux:
    name: linux ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --enable-werror CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        run: make -j"$(nproc)" check || { cat test-suite.log; exit 1; }

  sanitizers:
    name: linux clang asan+ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      # The runner's kernel randomizes more address bits than the
      # sanitizers' shadow memory layout allows for; they abort at start-up
      # under the default.
      - name: Narrow address randomization for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          ./autogen.sh
          ./configure CC=clang CXX=clang++
      - name: AddressSanitizer with leak detection
        run: make -j"$(nproc)" check-asan
      - name: UndefinedBehaviorSanitizer
        run: make -j"$(nproc)" check-ubsan

  dist:
    name: distcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_PACKAGES }}
      - name: Configure
        run: |
          ./autogen.sh
          ./configure
      - name: Build, install and test the release tarball out of tree
        run: make -j"$(nproc)" distcheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: relic-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # What users download, built where no autotools are installed: a stale
  # timestamp in the tarball would make make try to regenerate the build
  # system and fail here.
  tarball:
    name: tarball on ${{ matrix.image }}
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable-slim
            install: >-
              apt-get update &&
              apt-get install -y --no-install-recommends
              build-essential pkg-config libedit-dev mandoc
          - image: alpine:latest
            install: >-
              apk add --no-cache build-base pkgconf libedit-dev mandoc
    container: ${{ matrix.image }}
    steps:
      - name: Install a compiler and the suite's tools, and no autotools
        run: ${{ matrix.install }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      - name: Confirm no autotools are present
        run: |
          for tool in autoconf automake aclocal autoheader libtoolize; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool is installed; this job must build without it" >&2
              exit 1
            fi
          done
      - name: Unpack
        run: |
          mkdir build
          tar -xzf relic-*.tar.gz -C build
      - name: Configure, build and test
        run: |
          cd build/relic-*
          ./configure --enable-werror
          make -j"$(nproc)"
          make -j"$(nproc)" check || { cat test-suite.log; exit 1; }
